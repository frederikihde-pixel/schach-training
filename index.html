<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Schach-Training</title>
    <link rel="stylesheet" href="vendor/chessground/chessground.base.css" />
    <link rel="stylesheet" href="vendor/chessground/chessground.cburnett.css" />
    <link rel="stylesheet" href="css/board-theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Schach-Training</h1>
    </header>

    <main>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

      <div class="board-row">
        <div class="board-wrap">
          <div id="board"></div>
        </div>
      </div>

      <p id="view-hint" class="view-hint" hidden>Du betrachtest eine frühere Stellung.</p>

      <div class="controls">
        <button id="btn-back" type="button">Zurück</button>
        <button id="btn-forward" type="button">Vor</button>
        <button id="btn-flip" type="button">Brett drehen</button>
        <button id="btn-reset" type="button">Neustart</button>
      </div>

      <section class="fen-section">
        <h2>Stellung (FEN)</h2>
        <input
          id="fen-input"
          class="fen-input"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="FEN-Stellung"
        />
        <div class="fen-buttons">
          <button id="btn-fen-load" type="button">Laden</button>
          <button id="btn-fen-copy" type="button">Kopieren</button>
        </div>
        <p id="fen-error" class="fen-error" hidden></p>
      </section>

      <section class="history-section">
        <h2>Zugliste</h2>
        <div id="move-list" class="move-list"></div>
      </section>
    </main>

    <div id="promotion-overlay" class="promotion-overlay" hidden>
      <div class="promotion-box">
        <p>Umwandeln in:</p>
        <div class="promotion-choices" id="promotion-choices"></div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
